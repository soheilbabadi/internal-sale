pms:
  pre-factor:
    default-pms-user: jafari-h
rabbitmq:
  config:
    pms:
      exchange: internal.sales
      queues:
        pre-factor:
          name: internal.sales.pre-factor
          response-queue: local.internal.sales.retry-pre-factor
          response-routing-key: local-response-pre-factor
          routing-key: pre-factor
        lc:
          name: internal.sales.lc
          response-queue: local.internal.sales.retry-lc
          response-routing-key: local-response-lc
          routing-key: lc
          update-response-queue: local.internal.sales.retry-update-lc
          update-response-routing-key: local-response-update-lc
          update-queue: internal.sales.update-lc
        havaleh:
          name: internal.sales.havaleh
          response-queue: local.internal.sales.retry-havaleh
          response-routing-key: local-response-havaleh
          update-response-queue: local.internal.sales.retry-update-havaleh
          routing-key: havaleh
        bank:
          name: internal.sales.bank
          response-queue: local.internal.sales.response-bank
          response-routing-key: local-response-bank
          routing-key: bank
        customer:
          name: internal.sales.customer
          response-queue: local.internal.sales.response-customer
          response-routing-key: local-response-customer
          retry-routing-key: retry-customer
          routing-key: customer
